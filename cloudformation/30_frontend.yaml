AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Kiro Telemetry Dashboard - Frontend (private S3 bucket behind CloudFront
  with Origin Access Control, strict security headers, and an /api/* behavior
  that forwards to the backend HTTP API with an origin-verify secret so the
  API is unreachable except through this distribution).

Parameters:
  ApiEndpointDomain:
    Type: String
    Description: Backend HTTP API regional domain (ApiEndpoint output of 20_backend).
  OriginVerifySecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Must match the backend stack's OriginVerifySecret.

Resources:

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub kiro-dashboard-site-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration: {Status: Enabled}
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOACOnly
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt SiteBucket.Arn, !Sub '${SiteBucket.Arn}/*']
            Condition:
              Bool: {'aws:SecureTransport': 'false'}

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub kiro-dashboard-oac-${AWS::AccountId}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: kiro-dashboard-security-headers
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: true
            Override: true
          ContentTypeOptions: {Override: true}
          FrameOptions: {FrameOption: DENY, Override: true}
          ReferrerPolicy: {ReferrerPolicy: strict-origin-when-cross-origin, Override: true}
          ContentSecurityPolicy:
            # 'unsafe-inline' style only; scripts are same-origin files.
            # connect-src includes the Cognito domain for the token endpoint.
            ContentSecurityPolicy: >-
              default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline';
              img-src 'self' data:; connect-src 'self' https://*.amazoncognito.com;
              font-src 'self'; base-uri 'none'; form-action 'self';
              frame-ancestors 'none'; upgrade-insecure-requests
            Override: true

  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: kiro-dashboard-api-origin
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers: [authorization]      # JWT must reach the API authorizer
        CookiesConfig: {CookieBehavior: none}
        QueryStringsConfig: {QueryStringBehavior: all}

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Kiro Telemetry Dashboard
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site-s3
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig: {OriginAccessIdentity: ''}
          - Id: api
            DomainName: !Ref ApiEndpointDomain
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
            OriginCustomHeaders:
              - HeaderName: x-origin-verify
                HeaderValue: !Ref OriginVerifySecret
        DefaultCacheBehavior:
          TargetOriginId: site-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            # CloudFront method sets are fixed tiers; admin PUT /api/policy
            # needs the full tier. Non-GET still requires a valid JWT +
            # admins group at the API layer.
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # Managed-CachingDisabled
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
        CustomErrorResponses:
          # SPA deep links: serve index.html for S3 403/404 (OAC returns 403)
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10

Outputs:
  DistributionId:
    Value: !Ref Distribution
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
  SiteBucketName:
    Value: !Ref SiteBucket
